[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cc-baseline"
version = "0.1.0"
description = "A local flight recorder for Claude Code: tracks how its behaviour changes across versions, models and config, from your own transcripts. No tokens, no network."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cc-baseline = "ccbaseline.cli:main"

[tool.setuptools.packages.find]
include = ["ccbaseline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:asyncio"
